[package]
name = "memelith-clip"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
ort = "=2.0.0-rc.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
