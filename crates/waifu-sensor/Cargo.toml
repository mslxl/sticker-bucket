[package]
name = "waifu-sensor"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "waifu-sensor"
path = "src/bin/waifu-sensor.rs"
required-features = ["cli"]

[features]
default = ["onnx"]
cli = ["dep:anyhow", "dep:clap", "onnx"]
onnx = ["dep:ndarray", "dep:ort"]

[dependencies]
anyhow = { version = "1.0.100", optional = true }
bytemuck = "1.24.0"
clap = { version = "4.5.53", features = ["derive"], optional = true }
dirs = "6.0.0"
hex = "0.4.3"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
ndarray = { version = "0.17.2", optional = true }
ort = { version = "=2.0.0-rc.12", optional = true }
rand = "0.9.2"
rand_chacha = "0.9.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sha2 = "0.10.9"
sqlite-vec = "=0.1.7"
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["serde", "v4", "v5"] }
xz2 = "0.1.7"

[dev-dependencies]
tempfile = "3.23.0"
