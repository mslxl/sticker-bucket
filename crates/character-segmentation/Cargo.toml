[package]
name = "character-segmentation"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
default-run = "character-segmentation"

[lib]
path = "src/lib.rs"

[[bin]]
name = "character-segmentation"
path = "src/bin/character-segmentation.rs"

[[bin]]
name = "yolo11-seg"
path = "src/bin/yolo11-seg.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
ort = "=2.0.0-rc.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
