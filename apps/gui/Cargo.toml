[package]
name = "memelith"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "memelith"
path = "src/main.rs"

[package.metadata.bundle]
name = "Memelith"
identifier = "org.memelith.app"
category = "Graphics and Design"
short_description = "A local meme library and collector."
resources = [
    "crates/clip/assets/models/chinese-clip-vit-base-patch16",
    "crates/waifu-sensor/assets/models/ml-danbooru",
]
osx_minimum_system_version = "14.0"

[dependencies]
dirs = "6.0.0"
gpui.workspace = true
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
memelith-clip.workspace = true
memelith-core.workspace = true
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
unicode-segmentation = "1.12.0"
uuid = "1.19.0"
waifu-sensor.workspace = true

[dev-dependencies]
tempfile = "3.23.0"
